# Iomega ScreenPlay TV Link DX (Modell 35045)
# CoreELEC 21 · Odroid N2+ · Hardware-IR
# Protokoll: NEC (0x53xx)
# Erstellt: 2026-03-19 · ergänzt 2026-10-26 um Codes aus der Original-Firmware
#   (github.com/coolshou/screenplay-dx, libosdengine.a / input_dfb_events.o)
#
# Laden:   ir-keytable -w /storage/.config/rc_keymaps/iomega_screenplay.toml
# Testen:  ir-keytable -t

[[protocols]]
name = "iomega_screenplay"
protocol = "nec"

  [protocols.scancodes]
  # ── Navigation ───────────────────────────────────────────────────────────
  0x5312 = "KEY_POWER"
  0x5310 = "KEY_HOME"
  0x530f = "KEY_BACK"
  0x530c = "KEY_MENU"
  0x530d = "KEY_SETUP"
  0x5313 = "KEY_INFO"

  # ── Richtungstasten ──────────────────────────────────────────────────────
  0x5301 = "KEY_UP"
  0x5309 = "KEY_DOWN"
  0x5319 = "KEY_LEFT"
  0x5311 = "KEY_RIGHT"
  0x5340 = "KEY_OK"

  # ── Wiedergabe ───────────────────────────────────────────────────────────
  0x5344 = "KEY_PLAYPAUSE"
  0x534c = "KEY_STOP"
  0x5304 = "KEY_PREVIOUS"
  0x5317 = "KEY_NEXT"
  0x5350 = "KEY_REWIND"
  0x5352 = "KEY_FASTFORWARD"

  # ── Steuerscheibe links: 16 Richtungen (IR-Maus der Original-Firmware) ─
  # Quelle: irkernel.c.patch (ir_mouse_delta_pos) + Code-Reihenfolge aus
  # libosdengine.a. Die 4 Hauptrichtungen sind oben schon gemappt:
  #   oben 0x5344 = Play/Pause · rechts 0x5352 = FF
  #   unten 0x534c = Stop      · links  0x5350 = REW
  # Zwischenrichtungen (bei Bedarf einkommentieren und Taste vergeben):
  # 0x535a = ""   # oben-oben-rechts   (NNO)
  # 0x5355 = ""   # oben-rechts        (NO)
  # 0x531a = ""   # rechts-rechts-oben (ONO)
  # 0x534e = ""   # rechts-rechts-unten(OSO)
  # 0x5356 = ""   # unten-rechts       (SO)
  # 0x534b = ""   # unten-unten-rechts (SSO)
  # 0x534a = ""   # unten-unten-links  (SSW)
  # 0x5357 = ""   # unten-links        (SW)
  # 0x531f = ""   # links-links-unten  (WSW)
  # 0x531d = ""   # links-links-oben   (WNW)
  # 0x5354 = ""   # oben-links         (NW)
  # 0x535b = ""   # oben-oben-links    (NNW)

  # ── Audio / Video ────────────────────────────────────────────────────────
  0x5316 = "KEY_VOLUMEUP"
  0x530a = "KEY_VOLUMEDOWN"
  0x530e = "KEY_MUTE"

  # ── Online / Browser ─────────────────────────────────────────────────────
  0x5315 = "KEY_SEARCH"
  # 0x???? = "KEY_WWW"
  # 0x???? = "KEY_REFRESH"

  # ── Zahlen (FN + Taste) ───────────────────────────────────────────────────────────────
  # FN-Taste: 0x5378 (Modifier, kein Key-Mapping)
  0x5365 = "KEY_0"
  0x531b = "KEY_1"
  0x5308 = "KEY_2"
  0x5300 = "KEY_3"
  0x5302 = "KEY_4"
  0x5360 = "KEY_5"
  0x5361 = "KEY_6"
  0x5362 = "KEY_7"
  0x5363 = "KEY_8"
  0x5364 = "KEY_9"

  # ── Alphabet ─────────────────────────────────────────────────────────────
  # 0x???? = "KEY_A"
