# Iomega ScreenPlay DX - Fernbedienung (NEC, Adresse 0x53)
# Codes aus Firmware (libosdengine.a / input_dfb_events.o), github.com/coolshou/screenplay-dx
# Tastennamen unbekannt -> nach Test umbenennen (z.B. KEY_UP, KEY_ENTER ...)
# [NF] = auch im Netflix-Modus als Wiederholtaste gesetzt (vermutl. Pfeile + 2 weitere)

begin remote
  name  iomega_screenplay_dx
  bits           16
  flags SPACE_ENC|CONST_LENGTH
  eps            30
  aeps          100

  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat       9000  2250
  pre_data_bits  16
  pre_data       0xCA35
  gap          108000
  toggle_bit_mask 0x0

      begin codes
          BTN_CMD_44           0x22DD    # NEC cmd 0x44
          BTN_CMD_52           0x4AB5    # NEC cmd 0x52  [NF]
          BTN_CMD_4C           0x32CD    # NEC cmd 0x4C
          BTN_CMD_50           0x0AF5    # NEC cmd 0x50  [NF]
          BTN_CMD_55           0xAA55    # NEC cmd 0x55
          BTN_CMD_56           0x6A95    # NEC cmd 0x56
          BTN_CMD_57           0xEA15    # NEC cmd 0x57
          BTN_CMD_54           0x2AD5    # NEC cmd 0x54
          BTN_CMD_5A           0x5AA5    # NEC cmd 0x5A
          BTN_CMD_1A           0x58A7    # NEC cmd 0x1A  [NF]
          BTN_CMD_4E           0x728D    # NEC cmd 0x4E  [NF]
          BTN_CMD_4B           0xD22D    # NEC cmd 0x4B
          BTN_CMD_4A           0x52AD    # NEC cmd 0x4A
          BTN_CMD_1F           0xF807    # NEC cmd 0x1F  [NF]
          BTN_CMD_1D           0xB847    # NEC cmd 0x1D  [NF]
          BTN_CMD_5B           0xDA25    # NEC cmd 0x5B
      end codes

end remote
